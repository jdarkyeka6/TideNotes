name: TideNotes
options:
  bundleIdPrefix: com.jdarkyeka6
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  TideNotes:
    type: application
    platform: iOS
    sources:
      - TideNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jdarkyeka6.TideNotes
        PRODUCT_NAME: TideNotes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TideNotes
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Use Face ID to unlock locked TideNotes."
        MARKETING_VERSION: 0.1
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
